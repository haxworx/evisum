<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <title>Evisum oscilloscope</title>
  <defs>
    <linearGradient id="case" x2="1" y2="1">
      <stop stop-color="#696650"/>
      <stop offset=".48" stop-color="#34352e"/>
      <stop offset="1" stop-color="#192125"/>
    </linearGradient>
    <linearGradient id="panel" x2=".7" y2="1">
